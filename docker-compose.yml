services:
  mongo:
    image: mongo:7
    volumes: [mongo:/data/db]
  app:
    build: .
    ports: ["5000:5000"]
    environment:
      MONGO_URI: mongodb://mongo:27017/agritech
      JWT_SECRET: change-me
      ADMIN_EMAIL: admin@agritech.local
      ADMIN_PASSWORD: Admin@12345
    depends_on: [mongo]
volumes: { mongo: {} }
