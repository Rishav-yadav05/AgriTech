services:
  - type: web
    name: agritech
    runtime: node
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: node server/server.js
    envVars:
      - { key: MONGO_URI, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: ADMIN_EMAIL, value: admin@agritech.local }
      - { key: ADMIN_PASSWORD, sync: false }
